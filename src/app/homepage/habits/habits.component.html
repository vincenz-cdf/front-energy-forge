<div class="row">
    <div class="col-4 mb-1" *ngFor="let habit of habits; let i = index">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-2">
                        <div class="checkbox-wrapper-1 mt-1">
                            <input id="example-{{i}}" class="substituted" [checked]="habit.checked" type="checkbox"
                                aria-hidden="true" [disabled]="habit.checked"
                                (change)="updateHabit(habit, { checked: true }, i)" />
                            <label for="example-{{i}}"></label>
                        </div>

                        <div *ngIf="habit.showImage" class="icon-container" @bounceFadeOutAnimation>
                            <img src="../../../assets/sprites/ui/energy.png" alt="Bouncing image" />
                        </div>

                    </div>
                    <div class="col-8 title-edit">
                        <input class="no-border" *ngIf="habit.editMode" [(ngModel)]="habit.title"
                            (blur)="updateHabit(habit, { title: habit.title }, i)"
                            (keyup.enter)="updateHabit(habit, { title: habit.title}, i)" />

                        <span *ngIf="!habit.editMode" (click)="enableEditMode(habit)">
                            {{ habit.title }}
                        </span>
                    </div>
                    <div class="col-2">
                        <button class="btn btn-sm btn-danger active" (click)="deleteHabit(habit.id)"><i
                                class="fa fa-trash"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-4 mb-1 clickable-card" (click)="addHabit()">
        <div class="card">
            <div class="card-body" style="background-color: #983939;">
                <div class="row">
                    <div class="col-12">
                        <span class="strokeme">
                            <i class="fa fa-plus"></i> New Habit
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
