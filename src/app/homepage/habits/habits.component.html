<div className="row justify-content-md-center">
    <div className="jumbotron jumbotron-fluid">
        <div className="container">
            <div class="row">
                <div class="col-4 mb-1" *ngFor="let habit of habits">
                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-2">
                                    <input type="checkbox" [checked]="habit.checked"
                                        (change)="onCheckboxChange(habit)" />
                                </div>
                                <div class="col-10">
                                    {{ habit.title }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="col-4 mb-1 clickable-card" (click)="addHabit()">
                    <div class="card">
                        <div class="card-body" style="background-color: #983939;">
                            <div class="row">
                                <div class="col-12">
                                    <span class="strokeme">
                                        <i class="fa fa-plus"></i> Ajouter une tâche
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


            </div>


        </div>
    </div>
</div>
