<div class="row">
    <div class="col-4 mb-1" *ngFor="let habit of habits; let i = index">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-2">
                        <input type="checkbox" [checked]="habit.checked" [disabled]="habit.checked"
                        (change)="updateHabit(habit, { checked: true }, i)" />


                        <div *ngIf="habit.showImage" class="icon-container" @bounceFadeOutAnimation>
                            <img src="../../../assets/sprites/ui/energy.png" alt="Bouncing image" />
                        </div>
                        
                    </div>
                    <div class="col-10 title-edit">
                        <input class="no-border" *ngIf="habit.editMode" [(ngModel)]="habit.title"
                            (blur)="updateHabit(habit, { title: habit.title }, i)"
                            (keyup.enter)="updateHabit(habit, { title: habit.title}, i)" />

                        <span *ngIf="!habit.editMode" (click)="enableEditMode(habit)">
                            {{ habit.title }}
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-4 mb-1 clickable-card" (click)="addHabit()">
        <div class="card">
            <div class="card-body" style="background-color: #983939;">
                <div class="row">
                    <div class="col-12">
                        <span class="strokeme">
                            <i class="fa fa-plus"></i> Ajouter une tâche
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
