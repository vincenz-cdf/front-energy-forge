<div [ngClass]="isCombatInstance ? '' : 'card bg-image'" style="border-radius: 0px;">
    <div class="card-body">
        <div class="row mx-1">
            <div *ngFor="let char of characters"
                [ngClass]="isCombatInstance ? 'character-box' : 'col-auto character-box'">
                <div class="image-box" [attr.clickable]="!isCombatInstance"
                    (click)="isCombatInstance ? $event.stopPropagation() : openDialog(char)">
                    <img *ngIf="char.recovering" style="z-index: 2;" [src]="uiPaths.recover"
                        style="width: 36px; height: 36px;" class="rotated-image text-end" />
                    <img *ngIf="char.inCombat" style="z-index: 2;" [src]="uiPaths.battle"
                        style="width: 36px; height: 36px;" class="rotated-image" />
                    <img [src]="char.spritePath" alt="Main Character" class="rotated-image" />
                    <img *ngIf="isItemEquippedBySlot(char.equippedItems, 'BODY')" style="z-index: 1;"
                        [src]="splitEquipmentSlots(char.equippedItems, 'BODY').equipmentSpritePath" alt="Equipment"
                        class="rotated-image" />
                    <img *ngIf="isItemEquippedBySlot(char.equippedItems, 'HEAD')" style="z-index: 2;"
                        [src]="splitEquipmentSlots(char.equippedItems, 'HEAD').equipmentSpritePath" alt="Equipment"
                        class="rotated-image" />
                    <img *ngIf="isItemEquippedBySlot(char.equippedItems, 'RIGHTHAND')" style="z-index: 3;"
                        [src]="splitEquipmentSlots(char.equippedItems, 'RIGHTHAND').equipmentSpritePath"
                        class="rotated-image" />
                    <img *ngIf="isItemEquippedBySlot(char.equippedItems, 'ZWEIHAND')" style="z-index: 4;"
                        [src]="splitEquipmentSlots(char.equippedItems, 'ZWEIHAND').equipmentSpritePath"
                        class="rotated-image" />
                    <img *ngIf="isItemEquippedBySlot(char.equippedItems, 'LEFTHAND')" style="z-index: 4;"
                        [src]="splitEquipmentSlots(char.equippedItems, 'LEFTHAND').equipmentSpritePath"
                        class="rotated-image" />
                </div>
                <!-- Text beside the image -->
                <div [ngClass]="isCombatInstance ? 'col-3' : 'col-auto strokeme'">
                    <div>{{char.name}} Lvl.{{char.level}}</div>
                    <div class="reduced-margin"><img [src]="uiPaths.hp"
                            style="width: 35px; height: 35px; margin-left: -2px;" /> {{char.hp}}/{{char.maxHp}}</div>
                    <div class="reduced-margin"><img [src]="uiPaths.armor" style="width: 32px; height: 32px;" />
                        {{char.armor}}</div>
                    <div class="reduced-margin"><img [src]="uiPaths.attack" style="width: 35px; height: 35px;" />
                        {{isItemEquippedBySlot(char.equippedItems, 'RIGHTHAND') ? roundCeil(char.atk * 0.75) :
                        char.atk}}</div>
                    <div class="reduced-margin">
                        <!-- For High Mood -->
                        <img *ngIf="char.morale > 0.65 * char.maxMorale" [src]="uiPaths.moodHigh"
                            style="width: 35px; height: 35px;" />

                        <!-- For Mid Mood -->
                        <img *ngIf="char.morale <= 0.65 * char.maxMorale && char.morale >= 0.35 * char.maxMorale"
                            [src]="uiPaths.moodMid" style="width: 35px; height: 35px;" />

                        <!-- For Low Mood -->
                        <img *ngIf="char.morale < 0.35 * char.maxMorale" [src]="uiPaths.moodLow"
                            style="width: 35px; height: 35px;" />

                        {{char.morale}}/{{char.maxMorale}}
                    </div>
                </div>
                <div *ngIf="isCombatInstance" class="col-3"
                    style="display: flex; align-items: flex-end; justify-content: flex-end;">
                    <button *ngIf="!char.inCombat" class="btn btn-sm btn-warning" (click)="openDialog(char)"><i
                            class="fa fa-edit"></i></button>
                    <div *ngIf="!fromHabitScreen">
                        <button [disabled]="char.hp == 0" *ngIf="!char.awaiting" class="btn btn-sm btn-success"
                            (click)="characterPicked.emit(char)"><i class="fa fa-hand-point-right"></i></button>
                    </div>
                </div>
            </div>
            <div *ngIf="!isCombatInstance" style="display: flex; align-items: flex-end; justify-content: flex-end;">
                <button class="btn btn-sm btn-warning active" (click)="openAllCharactersDialog()">Show roaster</button>
            </div>
        </div>
    </div>
</div>
