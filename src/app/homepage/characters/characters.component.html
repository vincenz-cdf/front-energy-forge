<div class="card">
    <div class="card-body">
        <div class="row">
            <div class="col-3">
                <div class="card">
                    <div class="card-body">
                        <div class="flex-container">
                            <div class="image-container">
                                <img src="../../../assets/sprites/characters/mainchar.png" alt="Main Character"
                                    class="rotated-image" />
                                <img *ngIf="yes" src="../../../assets/sprites/equipments/hood.png" alt="Hood"
                                    class="rotated-image overlaid-image" />
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-secondary" (click)="yesClick()"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
