<header style="background-color: #fed000">
	<div class="container">
		<nav class="navbar navbar-expand-sm navbar-light py-0">
			<a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
				<img src="{{logoSrc}}" class="app-logo" alt="logo" />
			</a>
			<!-- This will only show on sm screens and above -->
			<li class="nav-item d-none d-sm-block">
				<a class="app-title strokeme px-2" href="/">{{pageTitle}}</a>
			</li>
			<!-- Toggler/collapsible Button -->
			<button *ngIf="isAuth" class="navbar-toggler" type="button" (click)="isNavbarCollapsed = !isNavbarCollapsed"
				[attr.aria-expanded]="!isNavbarCollapsed" aria-controls="navbarToggler">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div *ngIf="isAuth" [ngbCollapse]="isNavbarCollapsed" class="navbar-collapse" id="navbarToggler">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item">
						<a href="#" (click)="emitEvent('homepage')" class="nav-link"
							[ngClass]="{'text-color: #000000': currentPage == 'homepage', 'text-secondary': currentPage != 'homepage'}">Tasks</a>
					</li>
					<li class="nav-item">
						<a href="#" (click)="emitEvent('expedition')" class="nav-link"
							[ngClass]="{'text-color: #000000': currentPage == 'expedition', 'text-secondary': currentPage != 'expedition'}">Expedition</a>
					</li>
					<li class="nav-item">
						<a href="#" (click)="emitEvent('buildings')" class="nav-link"
							[ngClass]="{'text-color: #000000': currentPage == 'buildings', 'text-secondary': currentPage != 'buildings'}">Town</a>
					</li>
					<li class="nav-item">
						<a href="#" (click)="emitEvent('help')" class="nav-link"
							[ngClass]="{'text-color: #000000': currentPage == 'help', 'text-secondary': currentPage != 'help'}">Help</a>
					</li>
				</ul>
			</div>
			<div style="display: flex; align-items: center; justify-content: space-between;">
				<!-- Resources -->
				<app-resouces />

				<!-- User Button -->
				<div *ngIf="isAuth" ngbDropdown class="btn-group user-dropdown">
					<button class="btn btn-sm btn-dark" ngbDropdownToggle style="margin: 10px">
						<i class="fas fa-user"></i>
					</button>
					<div ngbDropdownMenu class="dropdown-menu-left">
						<button ngbDropdownItem (click)="buyDiamonds()">Buy diamonds <img [src]="uiPaths.diamond"
								style="width: 25%; height: auto; margin-top: -3px; margin-left: -3px;"
								alt="logo" /></button>
						<button ngbDropdownItem (click)="logoutEvent.emit()">Logout</button>
					</div>
				</div>

			</div>
			<button *ngIf="!isAuth" class="btn btn-danger active" style="position: absolute; right: 10px; top: 10px;"
				(click)="loginEvent.emit()">
				Login
			</button>
		</nav>
	</div>
</header>
