<header class="p-3" style="background-color: #fed000">
	<div class="container">
		<div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
			<a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
				<img src={{logoSrc}} class="app-logo" alt="logo" />
			</a>

			<ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
				<li><span class="app-title strokeme px-2">{{pageTitle}}</span></li>
				<li><a href="/" class="nav-link px-2 text-secondary">Tâches</a></li>
			</ul>
			


			<div class="text-end">
				<div class="row">
					<div class="col-6 mt-3">
						<app-resouces *ngIf="isAuth" />
					</div>
					<div class="col-6">
						<button *ngIf="!isAuth" class="btn btn-danger active" style="margin: 10px"
							(click)="loginEvent.emit()">
							Login
						</button>
						<button *ngIf="isAuth" class="btn btn-dark" style="margin: 10px" (click)="logoutEvent.emit()">
							Logout
						</button>
					</div>
				</div>

			</div>
		</div>
	</div>
</header>
