<div class="background"></div>
<div class="container" style="margin-top: 125px;">
	<div class="row mb-2">
		<div class="d-flex justify-content-center">
			<img [src]="'assets/images/newlogo.png'" style="width: 100px; height: auto; border-radius: 10px;" />
		</div>
	</div>
	<div class="row">
		<div class="d-flex justify-content-center">
			<div class="expedition-text">
				HabitQuest
			</div>
		</div>
	</div>
	<div class="row">
		<div class="d-flex justify-content-center">
			<form (ngSubmit)="onSubmitLogin()" #loginForm="ngForm">
				<div class="form-outline mb-4">
					<input type="login" id="loginName" name="login" class="form-control custom-input"
						[(ngModel)]="login" placeholder="Username" />
				</div>
				<div class="form-outline mb-4">
					<input type="password" id="loginPassword" name="password" class="form-control custom-input"
						[(ngModel)]="password" placeholder="Password" />
				</div>

				<div class="col-12">
					<button type="submit" style="background-color: #983939;" class="btn w-100"><span
							class="text-white">Sign in</span></button>
				</div>
			</form>
		</div>
	</div>
	<div class="row mt-4">
		<div class="d-flex justify-content-center">
			<div class="expedition-sm-text">
				Don't have a HabitQuest account? <strong (click)="goToRegister.emit()" style="cursor: pointer;">Sign up.</strong>
			</div>
		</div>

	</div>
</div>
