<div *ngIf="!goToLoginPage">

	<app-header [pageTitle]="'HabitQuest'" [isAuth]="isAuth" [logoSrc]="'../assets/images/newlogo.png'"
		(logoutEvent)="logout()" (loginEvent)="onLoginEvent()" (homepageEvent)="homepageEvent()"
		(expeditionEvent)="expeditionEvent()" (buildingsEvent)="buildingsEvent()" (helpEvent)="helpEvent()"></app-header>

	<app-auth-content *ngIf="componentToShow == 'messages'" />
	<app-expedition-content *ngIf="componentToShow == 'expedition'" />
	<app-buildings *ngIf="componentToShow == 'buildings'"></app-buildings>
	<app-help *ngIf="componentToShow == 'help'"></app-help>

	<app-welcome-content *ngIf="componentToShow == 'welcome'" (onSubmitRegisterEvent)="onRegister($event)" />


</div>

<div *ngIf="goToLoginPage">
	<app-login-form *ngIf="componentToShow == 'welcome'" (goToRegister)="goToRegister()" (onSubmitLoginEvent)="onLogin($event)" />
</div>
