<div>

	<app-header [pageTitle]="'HabitQuest'" [isAuth]="isAuth" [logoSrc]="'../assets/images/newlogo.png'"
		(logoutEvent)="logout()" (loginEvent)="onLoginEvent()" (homepageEvent)="homepageEvent()"
		(expeditionEvent)="expeditionEvent()" (buildingsEvent)="buildingsEvent()"></app-header>

	<app-auth-content *ngIf="componentToShow == 'messages'" />
	<app-expedition-content *ngIf="componentToShow == 'expedition'" />
	<app-buildings *ngIf="componentToShow == 'buildings'"></app-buildings>

	<app-welcome-content *ngIf="componentToShow == 'welcome'" />
	<app-login-form *ngIf="componentToShow == 'login'" (onSubmitLoginEvent)="onLogin($event)"
		(onSubmitRegisterEvent)="onRegister($event)" />

</div>
