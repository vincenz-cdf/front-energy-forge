<div class="modal-header">
    <h3>{{character.name}} Lvl.{{character.level}}</h3>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-3">
            <div class="character-box">
                <div class="image-box">
                    <img [src]="character.spritePath" alt="Main Character" class="rotated-image" />
                    <img *ngIf="character.equippedItems.length > 0" style="z-index: 2;"
                        [src]="splitEquipmentSlots(character.equippedItems, 'HEAD').equipmentSpritePath"
                        class="rotated-image" />
                </div>
                <!-- Text under the image -->
                <div class="mt-1" style="text-align: left;">
                    <div>Hp : {{character.hp}}/equipmenthp</div>
                    <div>Ar : {{character.armor}}/equipemntar</div>
                    <div>Atk : {{character.atk}}/equipemntattack</div>
                </div>
            </div>
        </div>
        <div class="col-9">
            <div class="row">
                <h5 class="col-12">Headgear</h5>
                <div *ngFor="let armor of allArmors" class="col-auto">
                    <div *ngIf="armor.equipment.slot == 'HEAD'" class="card">
                        <div class="card-body" [ngStyle]="{
                            'padding': '0',
                            'background-color': isItemEquipped(armor.equipment.id) ? '#f0daa0' : ''
                        }">
                            <img [src]="armor.equipment.spritePath" alt="X" class="img-fluid equipment-image"
                                (click)="equipEquipment(armor.id)" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-success" (click)="save()">Save</button>
</div>

<style>
    .character-box {
        text-align: center;
        margin-bottom: 16px;
        /* Optional: add some space between character boxes */
    }

    .image-box {
        position: relative;
        /* Make sure this is here */
        border: none;
        padding: 10px;
        width: 110px;
        height: 110px;
        display: flex;
        align-items: center;
        margin-right: 16px;
        /* Add space between the image box and the text */
    }

    .rotated-image {
        position: absolute;
        /* Make both images absolute */
        top: 0;
        /* Align to the top of the image-box */
        left: 0;
        /* Align to the left of the image-box */
        width: 100px;
        height: auto;
    }

    .strokeme {
        color: white;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    .bg-image {
        background-image: url("../../../assets/images/wallpaper.jpeg");
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    .equipment-image {
        width: 50px;
        /* Or whatever width you desire */
        height: auto;
        /* Maintain the aspect ratio */
    }
</style>
