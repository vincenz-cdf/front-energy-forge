<div class="background">
</div>

<div style="z-index: 1000;">
    <div class="container mt-2">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-sm-2 col-5">
                        <img [src]="templeSpritePath" class="img-fluid" style="border-radius: 2px;">
                    </div>
                    <div class="col-sm-10 col-7">
                        <div>
                            <h5>Temple</h5>
                        </div>
                        <div>
                            <div *ngFor="let char of characters">
                                <div *ngIf="!char.recovering" style="margin-top: -1px;">{{char.name}}
                                    Lvl.{{char.level}},<img [src]="hpUiPath"
                                        style="width: 32px; height: 32px; margin-left: -6px; margin-right: -6px;" />{{char.hp}}/{{char.maxHp}}
                                    <button (click)="heal(char.id)" type="button" class="btn btn-secondary" style="padding: 1px 3px;
                                        font-size: 9px;
                                        line-height: 0.7;">
                                        <span style="color: rgb(255, 255, 255);">{{(char.maxHp) - (char.hp)}}<img
                                                class="mr-n1" [src]="coinUiPath" style="width: 20px; height: 20px; margin-left: -6px; margin-right: -6px;"
                                                alt="logo" /></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card mt-1">
            <div class="card-body">
                <div class="row">
                    <div class="col-sm-2 col-5">
                        <img [src]="tavernSpritePath" class="img-fluid" style="border-radius: 2px;">
                    </div>
                    <div class="col-sm-10 col-7">
                        <h5>Tavern</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
